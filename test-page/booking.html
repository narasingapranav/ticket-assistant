<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Booking Page</title>
  <link rel="stylesheet" href="booking.css">
</head>
<body>

  <div class="booking-container">
    <h2>Angapradakshinam Booking Form (MOCK)</h2>
    <p>Please enter pilgrim details.</p>

    <form id="bookingForm" onsubmit="event.preventDefault(); alert('Submit clicked!');">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" placeholder="Enter Full Name">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gender">Gender *</label>
          <select id="gender" name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" placeholder="Age">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="idProofType">ID Proof Type *</label>
          <select id="idProofType" name="idProofType">
            <option value="">Select ID Proof</option>
            <option value="Aadhaar">Aadhaar Card</option>
            <option value="PAN">PAN Card</option>
            <option value="VoterID">Voter ID</option>
            <option value="Passport">Passport</option>
          </select>
        </div>
        <div class="form-group">
          <label for="idProofNumber">ID Proof Number *</label>
          <input type="text" id="idProofNumber" name="idProofNumber" placeholder="ID Number">
        </div>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number *</label>
        <input type="text" id="mobile" name="mobile" placeholder="10 digit mobile">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city">
        </div>
        <div class="form-group">
          <label for="state">State</label>
          <input type="text" id="state" name="state">
        </div>
        <div class="form-group">
          <label for="pincode">PIN Code</label>
          <input type="text" id="pincode" name="pincode">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit">Proceed to Next Step</button>
      </div>
    </form>
  </div>

</body>
</html>
